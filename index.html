    <style>
        /* ============================================================
                   ROOT VARIABLES & RESET
                   ============================================================ */
        :root {
            --bg-primary: #0A0E1A;
            --bg-secondary: #111827;
            --bg-card: #111827;
            --bg-card-hover: #1A2332;
            --bg-input: #1A2332;
            --border-color: #1E293B;
            --border-light: #2D3A4F;
            --text-primary: #E5E7EB;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            --accent: #3B82F6;
            --accent-hover: #2563EB;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --accent-glow-strong: rgba(59, 130, 246, 0.25);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.6);
            --font: 'Cairo', sans-serif;
            --max-width: 1200px;
            --header-height: 72px;
            --section-padding: 60px 0;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.75;
            padding-top: var(--header-height);
            overflow-x: hidden;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--accent-hover);
        }

        img,
        svg {
            display: block;
            max-width: 100%;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 28px;
        }

        /* ============================================================
                   SCROLLBAR
                   ============================================================ */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }

        /* ============================================================
                   GLASS UTILITY
                   ============================================================ */
        .glass {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(30, 41, 59, 0.5);
        }

        .glass-light {
            background: rgba(17, 24, 39, 0.55);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid rgba(30, 41, 59, 0.35);
        }

        /* ============================================================
                   HEADER
                   ============================================================ */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            z-index: 1050;
            background: rgba(10, 14, 26, 0.85);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border-bottom: 1px solid rgba(30, 41, 59, 0.4);
            transition: background var(--transition), border-color var(--transition);
            display: flex;
            align-items: center;
        }

        .header.scrolled {
            background: rgba(10, 14, 26, 0.96);
            border-bottom-color: rgba(59, 130, 246, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo .accent {
            color: var(--accent);
        }
        .logo .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 2px;
            box-shadow: 0 0 12px var(--accent-glow-strong);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
            align-items: center;
        }
        .nav-links a {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: color var(--transition);
            position: relative;
            padding: 4px 0;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 0;
            height: 2.5px;
            background: var(--accent);
            border-radius: 4px;
            transition: width var(--transition);
            box-shadow: 0 0 12px var(--accent-glow-strong);
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text-primary);
        }
        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-primary);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            transition: background var(--transition);
        }
        .hamburger:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ============================================================
                   SECTIONS COMMON
                   ============================================================ */
        section {
            padding: var(--section-padding);
            border-bottom: 1px solid rgba(30, 41, 59, 0.3);
            position: relative;
        }
        section:last-of-type {
            border-bottom: none;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }
        .section-label i {
            font-size: 0.7rem;
        }
        .section-label .line {
            width: 32px;
            height: 2px;
            background: var(--accent);
            border-radius: 4px;
        }

        .section-title {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 14px;
        }
        .section-sub {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 620px;
            line-height: 1.8;
        }

        .section-header {
            margin-bottom: 48px;
        }
        .section-header.centered {
            text-align: center;
        }
        .section-header.centered .section-sub {
            margin: 0 auto;
        }

        /* ============================================================
                   HERO
                   ============================================================ */
        .hero {
            min-height: calc(100vh - var(--header-height));
            display: flex;
            align-items: center;
            padding: 60px 0 80px;
            border-bottom: none;
            position: relative;
            overflow: hidden;
        }

        .hero-waves {
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            width: 100%;
            height: 180px;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }
        .hero-waves svg {
            width: 100%;
            height: 100%;
        }

        .hero .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            padding: 6px 18px 6px 22px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            width: fit-content;
        }
        .hero-badge .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }

        .hero h1 {
            font-size: clamp(2.4rem, 5.5vw, 4.2rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        .hero h1 .highlight {
            color: var(--accent);
            position: relative;
        }
        .hero h1 .highlight::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 0;
            width: 100%;
            height: 6px;
            background: var(--accent);
            opacity: 0.15;
            border-radius: 6px;
        }

        .hero-desc {
            font-size: 1.05rem;
            color: var(--text-secondary);
            max-width: 520px;
            line-height: 1.9;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 30px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 24px var(--accent-glow);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 40px var(--accent-glow-strong);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border-color: var(--border-light);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            transform: translateY(-2px);
            background: rgba(59, 130, 246, 0.05);
        }
        .btn-icon {
            width: 48px;
            height: 48px;
            padding: 0;
            border-radius: 60px;
            flex-shrink: 0;
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-code-block {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .hero-code-block::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 70% 30%, rgba(59, 130, 246, 0.03), transparent 60%);
            pointer-events: none;
        }
        .hero-code-block .dots {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }
        .hero-code-block .dots span {
            display: block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #2D3A4F;
        }
        .hero-code-block .dots span:nth-child(1) {
            background: #EF4444;
        }
        .hero-code-block .dots span:nth-child(2) {
            background: #F59E0B;
        }
        .hero-code-block .dots span:nth-child(3) {
            background: #10B981;
        }
        .hero-code-block pre {
            font-family: 'Cairo', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 2;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .hero-code-block pre .kw {
            color: #60A5FA;
        }
        .hero-code-block pre .fn {
            color: #34D399;
        }
        .hero-code-block pre .str {
            color: #FBBF24;
        }
        .hero-code-block pre .cmt {
            color: #6B7280;
        }
        .hero-code-block pre .var {
            color: #F472B6;
        }

        /* ============================================================
                   ABOUT
                   ============================================================ */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: start;
        }

        .about-text p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.9;
        }
        .about-text p strong {
            color: var(--text-primary);
        }

        .about-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px 18px;
            text-align: center;
            transition: all var(--transition);
        }
        .stat-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .stat-card .number {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent);
            display: block;
            line-height: 1.2;
        }
        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            display: block;
            margin-top: 4px;
        }

        /* ============================================================
                   SKILLS (Accordion)
                   ============================================================ */
        .skills-accordion {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 900px;
            margin: 0 auto;
        }

        .accordion-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: all var(--transition);
        }
        .accordion-item:hover {
            border-color: var(--border-light);
        }
        .accordion-item.open {
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            cursor: pointer;
            user-select: none;
            transition: background var(--transition);
            gap: 16px;
            background: transparent;
            border: none;
            width: 100%;
            text-align: right;
            font-family: var(--font);
            color: var(--text-primary);
        }
        .accordion-header:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        .accordion-header .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .accordion-header .left i {
            font-size: 1.2rem;
            color: var(--accent);
            width: 28px;
            text-align: center;
        }
        .accordion-header .left span {
            font-weight: 700;
            font-size: 1rem;
        }
